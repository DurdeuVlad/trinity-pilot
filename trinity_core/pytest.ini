[pytest]
testpaths = trinity_core/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = .
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: marks integration tests
    live_suite: requires TRINITY_RUN_LIVE=1
# Run coverage explicitly: pytest --cov=trinity_core --cov-report=html:coverage_html --cov-report=term-missing --cov-report=json:coverage.json
