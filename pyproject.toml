[project]
name = "trinity-pilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core UI
    "PyQt6>=6.11.0, <6.12",
    # AI providers
    "google-genai>=1.71.0, <1.72",
    "google-generativeai>=0.8.6, <0.9",
    "openai>=2.30.0, <2.31",
    "python-dotenv>=1.2.2, <1.3",
    # Persistence
    "sqlalchemy>=2.0.49, <2.1",
    "alembic>=1.18.4, <1.19",
    "diskcache>=5.6.3, <5.7",
    # Desktop automation
    "pywinauto>=0.6.9, <0.7",
    "pywin32>=311, <312",
    "psutil>=7.2.2, <7.3",
    # Web automation
    "playwright>=1.58.0, <1.59",
    # Backend services
    "fastapi>=0.135.3, <0.136",
    "uvicorn>=0.44.0, <0.45",
    "httpx>=0.28.1, <0.29",
    "fastmcp>=3.0.0,<4.0.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3, <9.1",
    "pytest-asyncio>=1.3.0, <1.4",
    "pytest-qt>=4.5.0, <4.6",
    "pytest-json-report>=1.5.0, <1.6",
    "pytest-cov>=5.0.0, <5.1",
    "black>=26.3.1, <26.4",
    "mypy>=1.20.0, <1.21",
    "pylint>=4.0.5, <4.1",
]
build = [
    "pyinstaller>=6.19.0, <6.20",
]

[project.scripts]
trinity-root = "trinity_core.runtime_mcp.root_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3, <9.1",
    "pytest-asyncio>=1.3.0, <1.4",
    "pytest-qt>=4.5.0, <4.6",
    "pytest-json-report>=1.5.0, <1.6",
    "pytest-cov>=5.0.0, <5.1",
    "black>=26.3.1, <26.4",
    "mypy>=1.20.0, <1.21",
    "pylint>=4.0.5, <4.1",
    "pyinstaller>=6.19.0, <6.20",
]
