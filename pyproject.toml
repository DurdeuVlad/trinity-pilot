[project]
name = "trinity-pilot"
version = "0.1.0"
description = "LLM-orchestrated desktop automation agent for Windows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Trinity Pilot contributors" }]
keywords = ["agent", "automation", "desktop", "llm", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
requires-python = ">=3.11"
dependencies = [
    # Desktop shell
    "PySide6>=6.8.0",
    # Capability boundary
    "fastmcp>=3.0.0,<4.0.0",
    "mcp>=1.0.0",
    # Browser domain
    "playwright>=1.50.0",
    "psutil>=7.0.0",
    # Terminal/code domain (PTY-backed ACI)
    "ptyprocess>=0.7.0",
    # Utilities
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.0",
    "tenacity>=9.0.0",
    "Pillow>=10.0.0",
    # SQLite is stdlib — no extra dep needed
    "aiosqlite>=0.19",
    # LLM
    "google-genai>=2.0.1",
    # Safety
    "pyautogui>=0.9.54",
    # Desktop automation (installed automatically on Windows)
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pywin32>=311; sys_platform == 'win32'",
    # UI theming
    "qt-material>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=0.3.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/DurdeuVlad/trinity-pilot"
Repository = "https://github.com/DurdeuVlad/trinity-pilot"
Issues = "https://github.com/DurdeuVlad/trinity-pilot/issues"
Security = "https://github.com/DurdeuVlad/trinity-pilot/security/advisories"

[project.scripts]
trinity-pilot = "trinity_pilot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real: mark test as requiring live environment",
    "live_audit: live audit tests write structured skip records before skipping",
    "e2e: end-to-end tests requiring live orchestrator",
    "desktop: requires visible Windows desktop",
    "slow: long-running scenarios",
    "vm_official: canonical VM failure/adversarial suite",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = false
warn_unused_ignores = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These test files call pytest.importorskip(...) before importing the
# module it guards, which ruff's import-order check can't model.
"tests/e2e/*.py" = ["E402"]
"tests/smoke/_harness.py" = ["E402"]
"tests/ui/*.py" = ["E402"]
"tests/unit/test_workflow_bridge.py" = ["E402"]
