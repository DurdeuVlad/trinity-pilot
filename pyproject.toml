[project]
name = "trinity-pilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Desktop shell
    "PySide6>=6.8.0",
    # Control plane
    "temporalio>=1.7.0",
    # Capability boundary
    "fastmcp>=3.0.0,<4.0.0",
    "mcp>=1.0.0",
    # Browser domain
    "playwright>=1.50.0",
    # Desktop-app domain (Windows-first)
    "pywinauto>=0.6.9",
    "pywin32>=311",
    "psutil>=7.0.0",
    # Terminal/code domain (PTY-backed ACI)
    "ptyprocess>=0.7.0",
    # Utilities
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    # SQLite is stdlib — no extra dep needed
    # LLM
    "google-generativeai>=0.8.0",
    # Safety
    "pyautogui>=0.9.54",
    "google-genai>=2.0.1",
    # UI theming
    "qt-material>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["real: mark test as requiring live environment"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = false
warn_unused_ignores = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
