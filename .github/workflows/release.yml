name: Release artifact

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - run: uv build
      - run: uv run python scripts/build_exe.py
      - name: Attest release artifacts
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/trinity-pilot-win64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: trinity-pilot-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/trinity-pilot-win64.zip
      - name: Attach artifacts to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/trinity-pilot-win64.zip --clobber
