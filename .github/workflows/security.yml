name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - run: uv run --with pip-audit pip-audit --strict
      - run: uv run --with pip-licenses pip-licenses --format=markdown --output-file=THIRD_PARTY_LICENSES.md
      - run: uv run --with cyclonedx-bom cyclonedx-py environment --of JSON -o trinity-pilot.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            THIRD_PARTY_LICENSES.md
            trinity-pilot.cdx.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
