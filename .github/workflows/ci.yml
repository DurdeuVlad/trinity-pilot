name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy trinity_pilot
      - run: uv run pytest tests/unit tests/integration tests/ui -v
      - run: uv build
      - run: uv run python scripts/build_exe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-build-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/trinity-pilot-win64.zip
          if-no-files-found: ignore
