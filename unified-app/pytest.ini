[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = .
addopts = -ra
filterwarnings =
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
markers =
    integration: marks mocked or worker-direct integration coverage
    e2e: marks real app-session production workflow coverage
    live: marks tests that require opt-in live backends
